provider: Zyte
providerId: zyte
description: >-
  Zyte publishes NO changelog, release notes or version history for Zyte API,
  the Stats API or the Scrapy Cloud API. Probed on 2026-08-29:
  docs.zyte.com/history.md, /changelog.md, /release-notes.md,
  /zyte-api/history.md and /zyte-api/changelog.md all 404, and the docs index
  and llms.txt (139 pages) contain no changelog entry. What Zyte does publish
  on a dated cadence is package and product-add-on changelogs. Those are
  recorded here so the artifact reflects what actually exists rather than
  claiming a surface Zyte does not run.
api_changelog:
  published: false
  probes:
    - url: https://docs.zyte.com/history.md
      status: 404
    - url: https://docs.zyte.com/changelog.md
      status: 404
    - url: https://docs.zyte.com/release-notes.md
      status: 404
    - url: https://docs.zyte.com/zyte-api/changelog.md
      status: 404
    - url: https://docs.zyte.com/llms.txt
      status: 200
      note: 139 documented pages; none is a changelog.
  consequence: >-
    An agent or an integrator cannot tell what changed in the Zyte API request
    or response schema between two dates. The contract is republished in place
    inside a documentation page with no version marker beyond info.version
    1.0.0, which has not moved.
