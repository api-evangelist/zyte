description: >-
  Zyte ships NO first-party MCP server. This is a deliberate product choice,
  not a gap: Zyte's agent surface is Agent Skills ("Agentic Web Data",
  github.com/zytedata/skills — see skills/_index.yml), and Zyte published a
  comparison of the two approaches at
  https://www.zyte.com/blog/claude-skills-vs-mcp-vs-web-scraping-copilot/ plus a
  build-your-own guide at https://www.zyte.com/blog/build-your-own-mcp-server/.
  Every "Zyte MCP" server discoverable today is third-party (Composio's
  zyte_api toolkit, apscrapes/zyte-fetch-page-content-mcp-server, FastMCP
  tutorials). The tools[] below are a CANDIDATE mapping derived from Zyte's own
  OpenAPI, offered as a specification for a server that does not exist. Nothing
  here is a callable endpoint.
