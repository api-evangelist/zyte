tools:
  - name: extract
    status: candidate
    description: >-
      Fetch a URL through Zyte API's anti-ban network and return any
      combination of raw HTTP body, browser-rendered HTML, screenshot, network
      captures and AI-extracted structured data.
    rest:
      - extract
    method: POST
    path: /extract
