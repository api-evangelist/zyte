aid: zyte
name: Zyte
description: >-
  Zyte (formerly Scrapinghub, the company behind the Scrapy framework) is a web
  data extraction platform. Its flagship Zyte API is a single POST endpoint that
  fetches any URL through an automatic anti-ban network, optionally rendering it
  in a browser, running interaction actions, capturing network traffic and
  screenshots, and returning AI-extracted structured data for products,
  articles, job postings, forum threads and search results. Alongside it Zyte
  runs Scrapy Cloud, a hosted platform for deploying and scheduling Scrapy
  spiders, a Stats API for usage and spend reporting, and the sunsetting Smart
  Proxy Manager. Zyte's agent strategy is Agent Skills rather than MCP: it
  publishes an official 15-skill "Agentic Web Data" plugin for Claude Code,
  Codex CLI and GitHub Copilot CLI.
