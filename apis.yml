apis:
  - aid: zyte:zyte
    name: Zyte API
    description: >-
      A single POST /extract operation that retrieves any public URL through
      Zyte's automatic ban-avoidance network and returns any combination of raw
      HTTP body, browser-rendered HTML, screenshots, network captures and
      AI-extracted structured data (product, productList, article, articleList,
      jobPosting, forumThread, pageContent, serp and LLM-driven custom
      attributes). Authenticated with HTTP Basic using a Zyte API key as the
      username and an empty password. Errors are RFC 9457 problem+json;
      rate-limiting and failed responses are not charged.
    humanURL: https://www.zyte.com/zyte-api/
    baseURL: https://api.zyte.com/v1
    tags:
      - Crawling
      - Data Extraction
      - Scraping
      - Browser Automation
      - Anti-Ban
    properties:
      - type: OpenAPI
        url: openapi/zyte-zyte-api-openapi.yaml
      - type: Overlay
        url: overlays/zyte-zyte-api-overlay.yaml
      - type: Documentation
        url: https://docs.zyte.com/zyte-api/get-started.html
      - type: APIReference
        url: https://docs.zyte.com/zyte-api/usage/reference.html
      - type: GettingStarted
        url: https://docs.zyte.com/zyte-api/get-started.html
  - aid: zyte:zyte-stats-api
    name: Zyte API Stats API
    description: >-
      Read recorded Zyte API usage — request volume, cost, response times and
      status codes — filtered and grouped by domain, API key label, response
      code, requested feature, extraction type and customer-supplied request
      tags. Authenticated with the Zyte DASHBOARD API key, which is not the
      Zyte API key, and scoped by a required organization_id parameter.
    humanURL: https://docs.zyte.com/zyte-api/usage/stats/index.html
    baseURL: https://zyte-api-stats.zyte.com
    tags:
      - Usage
      - Billing
      - Reporting
    properties:
      - type: OpenAPI
        url: openapi/zyte-stats-api-openapi.yaml
      - type: Documentation
        url: https://docs.zyte.com/zyte-api/usage/stats/index.html
      - type: APIReference
        url: https://docs.zyte.com/zyte-api/usage/stats/index.html
  - aid: zyte:zyte-scrapy-cloud
    name: Scrapy Cloud API
    description: >-
      The HTTP API for Scrapy Cloud, Zyte's hosted platform for running Scrapy
      spiders. Schedule, stop, update and delete jobs; list and count queued
      work; read job metadata, logs, requests and scraped items; manage
      collections, periodic jobs, comments and the frontier. Split across
      app.zyte.com for control operations and storage.zyte.com for data, with a
      third API key of its own. No machine-readable contract is published.
    humanURL: https://docs.zyte.com/scrapy-cloud/get-started.html
    baseURL: https://app.zyte.com/api
    tags:
      - Scrapy
      - Jobs
      - Hosting
      - Storage
    properties:
      - type: Documentation
        url: https://docs.zyte.com/scrapy-cloud/get-started.html
      - type: APIReference
        url: https://docs.zyte.com/scrapy-cloud/usage/reference/http/index.html
